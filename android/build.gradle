buildscript {
    ext {
        kotlin_version = '2.1.10'
        androidxMediaEnableMidiModule = true  // เพิ่มตรงนี้
    }
    repositories {
        google()
        mavenCentral()
        jcenter()
        maven { url 'https://jitpack.io' }  // เพิ่มบรรทัดนี้
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.15'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
        maven { url 'https://jitpack.io' }  // เพิ่มบรรทัดนี้
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << '-Xlint:-options' 
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Flutter can add Kotlin to Java-only plugins; keep both bytecode targets aligned.
    project.pluginManager.withPlugin('org.jetbrains.kotlin.android') {
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions.jvmTarget.set(project.provider {
                org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(
                    project.extensions.getByName('android').compileOptions.targetCompatibility.toString()
                )
            })
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

apply plugin: 'com.google.gms.google-services'
